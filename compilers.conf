# =============================================================================
# compilers.conf — Compiler definitions for build_mpi_stack.sh
#
# Format per entry (blank lines and lines starting with # are ignored):
#
#   [compiler_id]
#   family   = gcc | aocc | intel
#   version  = <version string passed to --compiler-version>
#   modules  = <space-separated list of modules to load in order>
#   cc       = <C compiler binary name>
#   cxx      = <C++ compiler binary name>
#   fc       = <Fortran compiler binary name>
#   cflags   = <extra CFLAGS for this compiler/version, optional>
#   cxxflags = <extra CXXFLAGS for this compiler/version, optional>
#   fflags   = <extra FFLAGS/FCFLAGS for this compiler/version, optional>
#
# The compiler_id is what you pass to --compiler-version on the command line,
# e.g.: --compiler=gcc --compiler-version=15.2.0
#
# modules are loaded left-to-right via `module load`. Put prerequisite/parent
# modules (e.g. gcc-compilers, amd-compilers, intel-compilers) before the
# versioned compiler module.
#
# cc/cxx/fc are the binary names looked up via `command -v` after modules load.
#
# cflags/cxxflags/fflags are compiler-version-specific workarounds (warning
# suppressions, inline-limit tweaks, etc.) applied on top of each package's
# own -O3 base flags, and are merged into CFLAGS/CXXFLAGS/FFLAGS/FCFLAGS once
# when the compiler module loads — build_ucx.sh, build_ucc.sh and
# build_ompi.sh all inherit them automatically, so package-specific
# compiler/version special-casing does not belong in those scripts.
# =============================================================================

# -----------------------------------------------------------------------------
# AOCC (AMD LLVM-based)
# -----------------------------------------------------------------------------
[aocc/5.0.0]
family   = aocc
version  = 5.0.0
modules  = amd-compilers aocc/5.0.0
cc       = clang
cxx      = clang++
fc       = flang
cflags   = -fPIC -m64 -Wno-error -Wno-unused-command-line-argument
cxxflags = -fPIC -m64 -Wno-error -Wno-unused-command-line-argument
fflags   = -Wno-unused-command-line-argument

[aocc/5.1.0]
family   = aocc
version  = 5.1.0
modules  = amd-compilers aocc/5.1.0
cc       = clang
cxx      = clang++
fc       = flang
cflags   = -fPIC -m64 -Wno-error -Wno-unused-command-line-argument
cxxflags = -fPIC -m64 -Wno-error -Wno-unused-command-line-argument
fflags   = -Wno-unused-command-line-argument

[aocc/5.2.0]
family   = aocc
version  = 5.2.0
modules  = amd-compilers aocc/5.2.0
cc       = clang
cxx      = clang++
fc       = flang
cflags   = -fPIC -m64 -Wno-error -Wno-unused-command-line-argument
cxxflags = -fPIC -m64 -Wno-error -Wno-unused-command-line-argument
fflags   = -Wno-unused-command-line-argument

[aocc/6.0.0]
family   = aocc
version  = 6.0.0
modules  = amd-compilers aocc/6.0.0
cc       = clang
cxx      = clang++
fc       = flang-new
cflags   = -fPIC -m64 -Wno-error=default-const-init-var-unsafe -Wno-unused-command-line-argument
cxxflags = -fPIC -m64 -Wno-error=default-const-init-var-unsafe -Wno-unused-command-line-argument
fflags   = -Wno-unused-command-line-argument

# -----------------------------------------------------------------------------
# GCC
# -----------------------------------------------------------------------------
[gcc/12.5.0]
family   = gcc
version  = 12.5.0
modules  = gcc-compilers gcc/12.5.0
cc       = gcc
cxx      = g++
fc       = gfortran

[gcc/13.3.0]
family   = gcc
version  = 13.3.0
modules  = gcc-compilers gcc/13.3.0
cc       = gcc
cxx      = g++
fc       = gfortran

[gcc/14.2.0]
family   = gcc
version  = 14.2.0
modules  = gcc-compilers gcc/14.2.0
cc       = gcc
cxx      = g++
fc       = gfortran

[gcc/14.3.0]
family   = gcc
version  = 14.3.0
modules  = gcc-compilers gcc/14.3.0
cc       = gcc
cxx      = g++
fc       = gfortran

[gcc/15.1.0]
family   = gcc
version  = 15.1.0
modules  = gcc-compilers gcc/15.1.0
cc       = gcc
cxx      = g++
fc       = gfortran

[gcc/15.2.0]
family   = gcc
version  = 15.2.0
modules  = gcc-compilers gcc/15.2.0
cc       = gcc
cxx      = g++
fc       = gfortran

[gcc/16.1.0]
family   = gcc
version  = 16.1.0
modules  = gcc-compilers gcc/16.1.0
cc       = gcc
cxx      = g++
fc       = gfortran
cflags   = --param=max-inline-insns-single=4000 -Wno-error=deprecated-openmp
cxxflags = --param=max-inline-insns-single=4000 -Wno-error=deprecated-openmp
fflags   = -Wno-error=deprecated-openmp

# -----------------------------------------------------------------------------
# Intel Classic (icc) — legacy, C/C++ only; Fortran via ifort
# -----------------------------------------------------------------------------
[icc/2023.2.0]
family   = intel
version  = 2023.2.0
modules  = intel-compilers icc/2023.2.0
cc       = icc
cxx      = icpc
fc       = ifort

[intel/2024.2.0]
family   = intel
version  = 2024.2.0
modules  = intel-compilers intel/2024.2.0
cc       = icx
cxx      = icpx
fc       = ifort
cflags   = -Wno-unused-command-line-argument
cxxflags = -Wno-unused-command-line-argument
fflags   = -Wno-unused-command-line-argument

